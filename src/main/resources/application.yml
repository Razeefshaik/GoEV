# Every connection setting can be overridden with an environment variable so the
# same jar runs locally (defaults below, matching docker-compose.yml) and on Render.
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: goev-server
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5433/goev}
    username: ${DATABASE_USERNAME:goev}
    password: ${DATABASE_PASSWORD:goev}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      # redis://[user:pass@]host:port, or rediss://... for TLS.
      url: ${REDIS_URL:redis://localhost:6379}

goev:
  # Comma-separated browser origins allowed to call /api/** and /ws (e.g. the Netlify site).
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8081,http://localhost:8888}
  mqtt:
    # false = run without any broker (hosted demo); dashboard demo controls still work.
    enabled: ${MQTT_ENABLED:true}
    # tcp://host:1883 for plain MQTT, ssl://host:8883 for TLS brokers such as HiveMQ Cloud.
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    client-id: ${MQTT_CLIENT_ID:goev-server}
    ev-status-topic: ev/+/status
    ev-request-topic: ev/+/request
    evcs-status-topic: evcs/+/status
    qos-heartbeat: 0
    qos-state-change: 1
  state:
    ev-ttl-seconds: 90
    evcs-ttl-seconds: 90
  routing:
    weight-distance: 0.35
    weight-soc-urgency: 0.15
    weight-queue: 0.2
    weight-headroom: 0.2
    weight-willingness: 0.1
    headroom-normalization-mva: 1.0
    max-acceptable-queue-length: 3
    default-min-soc-threshold-percent: 10.0
    default-energy-consumption-kwh-per-km: 0.2
    assumed-avg-speed-kmh: 30.0
    reservation-ttl-seconds: 300
    mode: greedy
    batch-window-ms: 10000
    batch-solver-time-limit-ms: 3000
