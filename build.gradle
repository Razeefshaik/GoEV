plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.goev'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('testcontainersVersion', "1.21.4")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.integration:spring-integration-mqtt'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.jgrapht:jgrapht-core:1.5.2'
    implementation 'ai.timefold.solver:timefold-solver-core:2.5.0'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.integration:spring-integration-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    maxHeapSize = '256m'
    maxParallelForks = 1
}

springBoot { mainClass = 'com.goev.GoevServerApplication' }

tasks.register('researchRun', JavaExec) {
    group = 'application'
    description = 'Standalone durable V2G research API/dashboard without PostgreSQL or Redis'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.goevresearch.ResearchApplication'
    args '--server.port=8081'
    maxHeapSize = '192m'
}

tasks.register('v2gBenchmark', JavaExec) {
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.goev.v2g.BenchmarkRunner'
    args layout.projectDirectory.dir('output/v2g').asFile.absolutePath
    maxHeapSize = '192m'
}

tasks.register('researchJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
    group = 'build'
    archiveClassifier = 'research'
    mainClass = 'com.goevresearch.ResearchApplication'
    classpath = sourceSets.main.runtimeClasspath
    targetJavaVersion = JavaVersion.VERSION_21
}
